[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AWS_MCP_Agent"
version = "0.1.0"
description = "AgentCore AG-UI Agent using Strands SDK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ag-ui-strands >= 0.1.7",
    "ag-ui-protocol >= 0.1.10",
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "fastapi >= 0.115.12",
    "mcp-proxy-for-aws >= 1.1.0",
    "strands-agents >= 1.15.0",
    "uvicorn >= 0.34.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "hypothesis>=6.155.6",
    "pytest>=9.1.1",
]

# `.build/` は scripts/build-agent-package.sh が生成する配布用パッケージで、
# サードパーティの依存を展開したものが入る。自分のコードではないため、
# lint とテストの対象から外す（除外しないと ruff が 1000 件以上の指摘を出し、
# pytest も依存側のテストを収集してしまう）。
[tool.ruff]
extend-exclude = [".build", ".venv"]

# 適用するルールセットを明示する。未指定だと ruff のバージョンによって選択される
# ルールが変わり、コードを変えていないのに指摘件数が動く。
# - E4/E7/E9, F: 実バグに直結するもの（未定義名、未使用 import、構文的な誤り）
# - I: import 順の統一
# - UP: 対象 Python バージョン（3.12+）で不要になった古い書き方の除去
# - B: よくあるバグパターン（可変デフォルト引数、ループ変数の束縛ミス等）
# スタイル系（E501 行長、TRY、SIM、RUF）は入れていない。特に RUF001/002/003 は
# 日本語のコメントと docstring を「曖昧な Unicode」として数百件報告するため、
# このリポジトリでは実質ノイズになる。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
norecursedirs = [".build", ".venv", "__pycache__"]
